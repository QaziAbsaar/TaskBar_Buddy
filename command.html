<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .panel {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #0d1117 0%, #161b22 50%, #1a1a2e 100%);
      border-radius: 16px;
      border: 1px solid rgba(0, 255, 65, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 65, 0.1);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0, 255, 65, 0.05);
      border-bottom: 1px solid rgba(0, 255, 65, 0.15);
      -webkit-app-region: drag;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff41;
      box-shadow: 0 0 6px #00ff41;
    }

    .status-dot.offline {
      background: #ff4141;
      box-shadow: 0 0 6px #ff4141;
    }

    .title-bar h2 {
      color: #e6edf3;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .title-bar h2 span {
      color: #00ff41;
      font-size: 10px;
      font-weight: 400;
      margin-left: 6px;
      opacity: 0.7;
    }

    .title-actions {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .title-actions button {
      width: 26px;
      height: 26px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #8b949e;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .title-actions button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e6edf3;
    }

    .title-actions .close-btn:hover {
      background: rgba(255, 65, 65, 0.2);
      border-color: rgba(255, 65, 65, 0.4);
      color: #ff4141;
    }

    .chat-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(0, 255, 65, 0.2); border-radius: 2px; }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      animation: msgIn 0.25s ease-out;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: rgba(88, 166, 255, 0.12);
      border: 1px solid rgba(88, 166, 255, 0.2);
      color: #c9d1d9;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(0, 255, 65, 0.06);
      border: 1px solid rgba(0, 255, 65, 0.12);
      color: #e6edf3;
      border-bottom-left-radius: 4px;
    }

    .msg.bot.error {
      border-color: rgba(255, 65, 65, 0.3);
      background: rgba(255, 65, 65, 0.06);
    }

    .msg.action-msg {
      align-self: center;
      max-width: 90%;
      background: rgba(255, 200, 0, 0.06);
      border: 1px solid rgba(255, 200, 0, 0.15);
      color: #ffc800;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg.action-msg .action-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg.system {
      align-self: center;
      background: rgba(0, 255, 65, 0.04);
      border: 1px dashed rgba(0, 255, 65, 0.15);
      color: #8b949e;
      font-size: 11px;
      text-align: center;
      padding: 8px 16px;
    }

    .typing-indicator {
      align-self: flex-start;
      padding: 10px 16px;
      background: rgba(0, 255, 65, 0.04);
      border: 1px solid rgba(0, 255, 65, 0.1);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      display: none;
      gap: 4px;
    }

    .typing-indicator.visible { display: flex; }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff41;
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid rgba(0, 255, 65, 0.1);
      background: rgba(0, 0, 0, 0.2);
    }

    .input-area input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e6edf3;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-area input:focus {
      border-color: rgba(0, 255, 65, 0.4);
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.1);
    }

    .input-area input::placeholder { color: rgba(139, 148, 158, 0.5); }

    .input-area button {
      width: 40px;
      height: 40px;
      background: rgba(0, 255, 65, 0.12);
      border: 1px solid rgba(0, 255, 65, 0.25);
      color: #00ff41;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .input-area button:hover {
      background: rgba(0, 255, 65, 0.2);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.15);
    }

    .input-area button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .msg code {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
    }

    .msg pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 6px;
      margin: 6px 0;
      overflow-x: auto;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.4;
    }

    .msg strong { color: #00ff41; }
    .msg em { color: #ffc800; font-style: italic; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="title-bar">
      <div class="title-left">
        <div class="status-dot" id="status-dot"></div>
        <h2>Humungousaur<span>AI Agent</span></h2>
      </div>
      <div class="title-actions">
        <button id="reset-btn" title="New Chat">&#8634;</button>
        <button class="close-btn" id="close-btn" title="Close">&times;</button>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="msg system">Humungousaur is online. Ask me anything or tell me to do something on your PC.</div>
    </div>

    <div class="typing-indicator" id="typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Ask anything or say 'open chrome'..." autofocus />
      <button id="send-btn" title="Send">&#9654;</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const chatArea = document.getElementById('chat-area');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const closeBtn = document.getElementById('close-btn');
    const resetBtn = document.getElementById('reset-btn');
    const typing = document.getElementById('typing');
    const statusDot = document.getElementById('status-dot');

    let isWaiting = false;

    ipcRenderer.send('check-api-key');
    ipcRenderer.on('api-key-status', (e, initialized) => {
      statusDot.className = initialized ? 'status-dot' : 'status-dot offline';
      if (!initialized) {
        addMsg("No API key set. Right-click the tray icon and go to Settings to add your Gemini API key.", 'system');
      }
    });

    function formatText(text) {
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre>$2</pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    function addMsg(text, type, extra) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      if (type === 'bot') {
        div.innerHTML = formatText(text);
      } else if (type === 'action-msg') {
        div.innerHTML = `<span class="action-icon">&#9889;</span> ${text}`;
      } else {
        div.textContent = text;
      }
      if (extra) div.classList.add(extra);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function setWaiting(val) {
      isWaiting = val;
      sendBtn.disabled = val;
      typing.classList.toggle('visible', val);
      if (val) chatArea.scrollTop = chatArea.scrollHeight;
    }

    function send() {
      const text = input.value.trim();
      if (!text || isWaiting) return;

      addMsg(text, 'user');
      input.value = '';
      setWaiting(true);

      ipcRenderer.send('chat-message', text);
    }

    ipcRenderer.on('chat-response', (e, data) => {
      setWaiting(false);

      if (data.action && data.actionResult) {
        addMsg(data.actionResult, 'action-msg');
      }

      if (data.message) {
        addMsg(data.message, 'bot', data.error ? 'error' : null);
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    sendBtn.addEventListener('click', send);
    closeBtn.addEventListener('click', () => window.close());

    resetBtn.addEventListener('click', () => {
      ipcRenderer.send('reset-chat');
      chatArea.innerHTML = '';
      addMsg('Chat reset. Fresh start!', 'system');
    });
  </script>
</body>
</html>
