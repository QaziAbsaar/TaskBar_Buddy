<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <!-- Body gradient - deeper/more intense brown -->
    <linearGradient id="bodyGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8882E"/>
      <stop offset="50%" stop-color="#9A6E22"/>
      <stop offset="100%" stop-color="#7D5518"/>
    </linearGradient>
    <!-- Dark shadow areas -->
    <linearGradient id="darkBodyGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7D5518"/>
      <stop offset="100%" stop-color="#5C3F10"/>
    </linearGradient>
    <!-- Belly -->
    <linearGradient id="bellyGradA" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#CCA040"/>
      <stop offset="100%" stop-color="#B8882E"/>
    </linearGradient>
    <!-- Omnitrix -->
    <radialGradient id="omnitrixGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00FF00"/>
      <stop offset="70%" stop-color="#00CC00"/>
      <stop offset="100%" stop-color="#009900"/>
    </radialGradient>
    <!-- Red glowing eyes -->
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="60%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </radialGradient>
    <!-- Rage aura -->
    <filter id="rageGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== LEGS (crouched / wider stance) ===== -->
  <!-- Left leg - bent, crouched -->
  <path d="M34,112 L28,132 Q26,138 28,142 L30,146 L40,146 Q42,142 42,138 L46,112 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <path d="M36,116 Q32,124 32,134" stroke="#7D5518" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Right leg - bent, crouched -->
  <path d="M74,112 L78,132 Q80,138 82,142 L84,146 L94,146 Q96,142 94,138 L86,112 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <path d="M82,116 Q84,124 82,134" stroke="#7D5518" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Left foot claws (spread aggressively) -->
  <path d="M28,145 L23,153 L28,150" fill="#7D5518" stroke="#5C3F10" stroke-width="0.6"/>
  <path d="M32,145 L30,154 L34,151" fill="#7D5518" stroke="#5C3F10" stroke-width="0.6"/>
  <path d="M36,146 L38,154 L40,150" fill="#7D5518" stroke="#5C3F10" stroke-width="0.6"/>
  <!-- Right foot claws -->
  <path d="M82,145 L79,153 L83,150" fill="#7D5518" stroke="#5C3F10" stroke-width="0.6"/>
  <path d="M86,145 L85,154 L88,151" fill="#7D5518" stroke="#5C3F10" stroke-width="0.6"/>
  <path d="M90,146 L93,153 L94,149" fill="#7D5518" stroke="#5C3F10" stroke-width="0.6"/>

  <!-- ===== TAIL (raised aggressively) ===== -->
  <path d="M82,105 Q98,100 108,95 Q116,90 118,84 Q115,82 110,86 Q100,94 84,100" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Tail spikes -->
  <path d="M100,94 L103,88 L105,94" fill="#7D5518" stroke="#5C3F10" stroke-width="0.4"/>
  <path d="M108,90 L112,84 L112,91" fill="#7D5518" stroke="#5C3F10" stroke-width="0.4"/>

  <!-- ===== TORSO (hunched forward, aggressive) ===== -->
  <path d="M28,58 Q24,68 26,82 Q28,96 32,112 L86,112 Q90,96 92,82 Q94,68 90,58 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Belly plate -->
  <path d="M40,63 Q38,78 40,93 Q42,106 46,110 L72,110 Q76,106 78,93 Q80,78 78,63 Z" fill="url(#bellyGradA)" stroke="#9A6E22" stroke-width="0.5" opacity="0.7"/>
  <!-- Chest muscle lines (more pronounced / tense) -->
  <path d="M59,60 L59,76" stroke="#7D5518" stroke-width="1.2" opacity="0.5"/>
  <path d="M46,66 Q52,70 59,68" stroke="#7D5518" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M72,66 Q66,70 59,68" stroke="#7D5518" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Abs (tensed) -->
  <path d="M50,83 L68,83" stroke="#7D5518" stroke-width="0.8" opacity="0.4"/>
  <path d="M48,91 L70,91" stroke="#7D5518" stroke-width="0.8" opacity="0.4"/>
  <path d="M47,99 L71,99" stroke="#7D5518" stroke-width="0.8" opacity="0.4"/>

  <!-- ===== OMNITRIX SYMBOL ===== -->
  <circle cx="59" cy="73" r="7" fill="#111" stroke="#333" stroke-width="1.5"/>
  <circle cx="59" cy="73" r="5" fill="url(#omnitrixGlowA)" filter="url(#rageGlow)"/>
  <path d="M56,70 L59,73 L56,76 Z" fill="#004400"/>
  <path d="M62,70 L59,73 L62,76 Z" fill="#004400"/>
  <circle cx="59" cy="73" r="10" fill="none" stroke="#00FF00" stroke-width="0.6" opacity="0.4"/>

  <!-- ===== ARMS (raised, fists clenched) ===== -->
  <!-- Left arm - raised and bent, fist up -->
  <path d="M28,58 Q18,55 12,50 Q6,46 5,40 Q4,34 8,30 L14,32 Q12,38 14,44 Q16,50 24,54 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Left forearm -->
  <path d="M8,30 Q4,24 3,18 Q2,12 5,8 L14,10 Q12,16 12,22 Q13,28 14,32 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Left bicep bulge -->
  <path d="M16,52 Q10,44 10,36" stroke="#7D5518" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Left fist (clenched) -->
  <rect x="2" y="4" width="14" height="10" rx="4" fill="url(#darkBodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <line x1="5" y1="7" x2="5" y2="11" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>
  <line x1="8" y1="6" x2="8" y2="12" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>
  <line x1="11" y1="6" x2="11" y2="12" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>
  <line x1="14" y1="7" x2="14" y2="11" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>

  <!-- Right arm - raised and bent, fist up -->
  <path d="M90,58 Q100,55 106,50 Q112,46 113,40 Q114,34 110,30 L104,32 Q106,38 104,44 Q102,50 94,54 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Right forearm -->
  <path d="M110,30 Q114,24 115,18 Q116,12 113,8 L104,10 Q106,16 106,22 Q105,28 104,32 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Right bicep bulge -->
  <path d="M102,52 Q108,44 108,36" stroke="#7D5518" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Right fist (clenched) -->
  <rect x="102" y="4" width="14" height="10" rx="4" fill="url(#darkBodyGradA)" stroke="#5C3F10" stroke-width="0.8"/>
  <line x1="105" y1="7" x2="105" y2="11" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>
  <line x1="108" y1="6" x2="108" y2="12" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>
  <line x1="111" y1="6" x2="111" y2="12" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>
  <line x1="114" y1="7" x2="114" y2="11" stroke="#5C3F10" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== SHOULDER MUSCLES (bulging) ===== -->
  <ellipse cx="30" cy="58" rx="9" ry="6" fill="url(#darkBodyGradA)" stroke="#5C3F10" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="88" cy="58" rx="9" ry="6" fill="url(#darkBodyGradA)" stroke="#5C3F10" stroke-width="0.5" opacity="0.6"/>

  <!-- ===== HEAD (leaning forward, aggressive) ===== -->
  <!-- Neck (thicker, tensed) -->
  <rect x="48" y="44" width="22" height="16" rx="5" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="0.5"/>
  <!-- Neck veins -->
  <path d="M52,46 L50,56" stroke="#7D5518" stroke-width="0.6" opacity="0.4"/>
  <path d="M66,46 L68,56" stroke="#7D5518" stroke-width="0.6" opacity="0.4"/>

  <!-- Head shape -->
  <path d="M38,22 Q36,12 40,5 Q46,-1 59,0 Q72,-1 78,5 Q82,12 80,22 Q82,30 82,36 Q82,46 78,50 L40,50 Q36,46 36,36 Q36,30 38,22 Z" fill="url(#bodyGradA)" stroke="#5C3F10" stroke-width="1"/>

  <!-- Brow ridge (more pronounced, angry) -->
  <path d="M40,18 Q46,22 50,20" stroke="#5C3F10" stroke-width="2.5" fill="none"/>
  <path d="M78,18 Q72,22 68,20" stroke="#5C3F10" stroke-width="2.5" fill="none"/>

  <!-- Eyes (RED / GLOWING) -->
  <ellipse cx="50" cy="24" rx="5" ry="3.5" fill="url(#eyeGlow)" filter="url(#rageGlow)" stroke="#5C3F10" stroke-width="0.8"/>
  <ellipse cx="68" cy="24" rx="5" ry="3.5" fill="url(#eyeGlow)" filter="url(#rageGlow)" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Pupils (slit, angry) -->
  <ellipse cx="51" cy="24" rx="1.5" ry="3" fill="#330000"/>
  <ellipse cx="69" cy="24" rx="1.5" ry="3" fill="#330000"/>
  <!-- Eye glow effect -->
  <ellipse cx="50" cy="24" rx="7" ry="5" fill="none" stroke="#FF0000" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="68" cy="24" rx="7" ry="5" fill="none" stroke="#FF0000" stroke-width="0.5" opacity="0.3"/>

  <!-- Snout/jaw area -->
  <path d="M42,30 Q40,34 41,40 Q43,46 52,48 L66,48 Q75,46 77,40 Q78,34 76,30" fill="url(#bellyGradA)" stroke="#7D5518" stroke-width="0.5"/>

  <!-- Nostrils (flared) -->
  <ellipse cx="52" cy="32" rx="2.5" ry="2" fill="#5C3F10"/>
  <ellipse cx="66" cy="32" rx="2.5" ry="2" fill="#5C3F10"/>

  <!-- MOUTH OPEN - SHOWING TEETH (ROARING) -->
  <!-- Mouth opening -->
  <path d="M45,38 Q50,34 59,34 Q68,34 73,38 Q70,48 59,49 Q48,48 45,38 Z" fill="#3D0000" stroke="#5C3F10" stroke-width="0.8"/>
  <!-- Upper teeth -->
  <path d="M47,38 L49,42 L51,38 L53,42 L55,38 L57,41 L59,38 L61,41 L63,38 L65,42 L67,38 L69,42 L71,38" fill="none" stroke="#FFFFDD" stroke-width="1.2"/>
  <!-- Lower teeth -->
  <path d="M49,46 L50,43 L52,46 L54,43 L56,46 L58,43 L60,46 L62,43 L64,46 L66,43 L68,46" fill="none" stroke="#FFFFDD" stroke-width="1"/>
  <!-- Fangs -->
  <path d="M48,38 L47,43 L50,39" fill="#FFFFDD" stroke="#DDDDAA" stroke-width="0.3"/>
  <path d="M70,38 L71,43 L68,39" fill="#FFFFDD" stroke="#DDDDAA" stroke-width="0.3"/>
  <!-- Tongue -->
  <ellipse cx="59" cy="44" rx="5" ry="2" fill="#CC3333" opacity="0.8"/>

  <!-- Head crest/ridges (more aggressive) -->
  <path d="M46,3 L48,-2 L52,2" fill="#7D5518" stroke="#5C3F10" stroke-width="0.5"/>
  <path d="M55,1 L59,-4 L63,1" fill="#7D5518" stroke="#5C3F10" stroke-width="0.5"/>
  <path d="M66,3 L70,-2 L72,2" fill="#7D5518" stroke="#5C3F10" stroke-width="0.5"/>

  <!-- ===== RAGE LINES / VEINS ===== -->
  <!-- Forehead veins -->
  <path d="M44,14 Q46,10 50,12" stroke="#CC6633" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M74,14 Q72,10 68,12" stroke="#CC6633" stroke-width="0.5" fill="none" opacity="0.5"/>
  <!-- Arm veins -->
  <path d="M10,36 Q8,30 10,24" stroke="#CC6633" stroke-width="0.4" fill="none" opacity="0.4"/>
  <path d="M108,36 Q110,30 108,24" stroke="#CC6633" stroke-width="0.4" fill="none" opacity="0.4"/>
</svg>