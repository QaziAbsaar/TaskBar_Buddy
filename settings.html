<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .panel {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #0d1117, #161b22);
      border-radius: 14px;
      border: 1px solid rgba(0, 255, 65, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0, 255, 65, 0.05);
      border-bottom: 1px solid rgba(0, 255, 65, 0.12);
      -webkit-app-region: drag;
    }

    .title-bar h2 {
      color: #e6edf3;
      font-size: 13px;
      font-weight: 600;
    }

    .close-btn {
      -webkit-app-region: no-drag;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #8b949e;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .close-btn:hover {
      background: rgba(255, 65, 65, 0.2);
      color: #ff4141;
    }

    .content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      color: #8b949e;
      font-size: 12px;
      display: block;
      margin-bottom: 6px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    input[type="password"], input[type="text"] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e6edf3;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: rgba(0, 255, 65, 0.4);
    }

    .help-text {
      color: #6e7681;
      font-size: 11px;
      margin-top: 6px;
      line-height: 1.5;
    }

    .help-text a {
      color: #58a6ff;
      text-decoration: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn-row button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      transition: all 0.15s;
    }

    .btn-save {
      background: rgba(0, 255, 65, 0.12);
      border-color: rgba(0, 255, 65, 0.3);
      color: #00ff41;
    }

    .btn-save:hover {
      background: rgba(0, 255, 65, 0.2);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: #8b949e;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e6edf3;
    }

    .status {
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      transition: opacity 0.2s;
    }

    .status.success { color: #00ff41; }
    .status.error { color: #ff4141; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="title-bar">
      <h2>Settings</h2>
      <button class="close-btn" id="close-btn">&times;</button>
    </div>
    <div class="content">
      <div class="input-group">
        <label>Gemini API Key</label>
        <input type="password" id="api-key" placeholder="AIza..." />
        <div class="help-text">
          Get a free key at <a href="#" id="link-aistudio">aistudio.google.com/apikey</a>
        </div>
      </div>
      <div class="status" id="status"></div>
      <div class="btn-row">
        <button class="btn-cancel" id="cancel-btn">Cancel</button>
        <button class="btn-save" id="save-btn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer, shell } = require('electron');

    const apiKeyInput = document.getElementById('api-key');
    const saveBtn = document.getElementById('save-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const closeBtn = document.getElementById('close-btn');
    const statusEl = document.getElementById('status');
    const linkAistudio = document.getElementById('link-aistudio');

    ipcRenderer.send('get-api-key');
    ipcRenderer.on('current-api-key', (e, key) => {
      if (key) apiKeyInput.value = key;
    });

    linkAistudio.addEventListener('click', (e) => {
      e.preventDefault();
      shell.openExternal('https://aistudio.google.com/apikey');
    });

    saveBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        statusEl.textContent = 'Please enter an API key';
        statusEl.className = 'status error';
        return;
      }
      statusEl.textContent = 'Saving...';
      statusEl.className = 'status';
      ipcRenderer.send('save-api-key', key);
    });

    ipcRenderer.on('api-key-saved', (e, result) => {
      if (result.success) {
        statusEl.textContent = 'Saved! Humungousaur is powered up!';
        statusEl.className = 'status success';
        setTimeout(() => window.close(), 1200);
      } else {
        statusEl.textContent = result.error || 'Failed to save';
        statusEl.className = 'status error';
      }
    });

    cancelBtn.addEventListener('click', () => window.close());
    closeBtn.addEventListener('click', () => window.close());
  </script>
</body>
</html>
